<style>
/* Layout: app shell. Sticky top bar, session list on the left (picker on phones), session view on the right. */
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --sunken: #f5f8f9;
  --ink: #13212a;
  --ink-2: #4f606a;
  --ink-3: #7b8b94;
  --line: #d8e1e5;
  --grid: #e7edf0;
  --accent: #0d6a83;
  --accent-soft: #dcedf2;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --s-alt: #2a78d6;
  --s-motor: #eb6834;
  --s-lift: #1baf7a;
  --s-glide: #a9b6bd;
  --s-ground: #d6dee2;
  --s-4: #e87ba4;
  --s-5: #6250d6;
  --h-low: #86b6ef;
  --h-high: #0d366b;
  --scrim: rgba(10, 20, 26, .45);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #151f25; --sunken: #111a1f; --ink: #e4ecef; --ink-2: #a3b3bb; --ink-3: #74858e;
    --line: #25333b; --grid: #1e2a31; --accent: #52b6d2; --accent-soft: #17323b;
    --s-alt: #3987e5; --s-motor: #d95926; --s-lift: #199e70; --s-glide: #5b6a72; --s-ground: #2b383f; --s-4: #d55181; --s-5: #9085e9;
    --h-low: #184f95; --h-high: #cde2fb; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #151f25; --sunken: #111a1f; --ink: #e4ecef; --ink-2: #a3b3bb; --ink-3: #74858e;
  --line: #25333b; --grid: #1e2a31; --accent: #52b6d2; --accent-soft: #17323b;
  --s-alt: #3987e5; --s-motor: #d95926; --s-lift: #199e70; --s-glide: #5b6a72; --s-ground: #2b383f; --s-4: #d55181; --s-5: #9085e9;
  --h-low: #184f95; --h-high: #cde2fb; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 700 22px/1 var(--font-display); letter-spacing: .02em; }
.brand span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 6px; font-weight: 600; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.controls { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sunken); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 4px 10px 4px 6px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.toggle .sw { width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.toggle[aria-pressed="true"] { color: var(--accent); }
.toggle[aria-pressed="true"] .sw { background: var(--accent); }
.toggle[aria-pressed="true"] .sw::after { left: 14px; }
.helpbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 4px 10px 4px 5px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.helpbtn i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--surface); font: 700 12px/18px var(--font-body); text-align: center; font-style: normal; }

/* shell */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100% - 56px); }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 12px 24px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.main { padding-block: 18px 40px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; display: flex; flex-direction: column; gap: 16px; }

.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--sunken); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .file { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.drop small { color: var(--ink-3); }
.sidehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sidehead h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.slist { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sday { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 10px 8px 4px; }
.sitem { display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.sitem:hover { background: var(--sunken); }
.sitem[aria-current="true"] { background: var(--accent-soft); }
.sitem .t { font: 600 16px/1 var(--font-display); }
.sitem .k { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.sitem .m { font-size: 12.5px; color: var(--ink-3); text-align: right; }
.sitem canvas { grid-column: 2 / 4; width: 100%; height: 16px; }
.sitem.dim .t, .sitem.dim .k { color: var(--ink-3); }
.kdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.keys { font-size: 12px; color: var(--ink-3); }
kbd { font: 500 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--sunken); }
.mpicker { display: none; }

/* session header */
.shead { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.shead h1 { font-size: 30px; line-height: 1.05; }
.shead .sub { color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.navbtns { display: flex; gap: 6px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--sunken); border: 1px solid var(--line); color: var(--ink-2); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.summary { font-size: 18px; line-height: 1.5; max-width: 70ch; color: var(--ink); margin: 0; }
.summary b { font-weight: 700; }

.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card h3 { font-size: 17px; }
.hint { font-size: 13.5px; color: var(--ink-2); }
.lbl { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.tile .v { font: 600 32px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 16px; color: var(--ink-2); margin-left: 3px; font-weight: 500; }
.sectionhead { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.sectionhead h2 { font-size: 20px; }
.sectionhead p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* rating card */
.rating { gap: 6px; }
.rating .top3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rating .word { font: 600 22px/1.1 var(--font-display); }
.meter { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; flex: none; vertical-align: middle; }
.meter i { width: 6px; border-radius: 2px; background: var(--grid); }
.meter i:nth-child(1) { height: 7px; } .meter i:nth-child(2) { height: 10px; } .meter i:nth-child(3) { height: 14px; } .meter i:nth-child(4) { height: 18px; }
.meter.neutral i.on { background: var(--ink-2); }
details.more { font-size: 13.5px; color: var(--ink-2); }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+ "; }
details.more[open] summary::before { content: "− "; }
.kv { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 6px 0 0; justify-content: start; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; color: var(--ink); }
.alert { border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); }
.alert .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 13px; }
.alert b { display: block; }

/* charts. The header row has a fixed height so the hover readout never changes the layout. */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 10px 4px; min-width: 0; }
.chart .ch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 4px; height: 26px; }
.chart .ch b { font: 600 16px/1 var(--font-display); white-space: nowrap; flex: none; }
.chart .ch .ro { font-size: 13px; line-height: 1; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chart .plot { width: 100%; }
.chart .sub { font-size: 13px; color: var(--ink-2); padding: 0 4px 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 2px 4px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 3px; border-radius: 2px; }
.striplabel { font-size: 12.5px; color: var(--ink-2); padding: 6px 4px 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* 3D view */
.view3d .stage { position: relative; }
.view3d canvas { width: 100%; height: 420px; display: block; touch-action: none; cursor: grab; border-radius: 8px; background: var(--sunken); }
.view3d canvas:active { cursor: grabbing; }
.view3d .tools { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.view3d .help { position: absolute; bottom: 8px; right: 12px; font-size: 12px; color: var(--ink-3); }
.simbanner { display: flex; gap: 10px; align-items: center; border: 1.5px dashed var(--s-5); background: var(--sunken); border-radius: var(--radius); padding: 10px 14px; flex-wrap: wrap; }
.simbanner b { color: var(--s-5); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }

/* help dialog */
dialog.helpdlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100% - 48px); background: var(--surface); color: var(--ink); }
dialog.helpdlg::backdrop { background: var(--scrim); }
.helpdlg .hd { position: sticky; top: 0; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.helpdlg .hd h2 { font-size: 24px; }
.helpdlg .bd { padding: 8px 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.helpdlg h3 { font-size: 18px; margin-top: 12px; }
.helpdlg p { margin: 0; max-width: 68ch; }
.helpdlg ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; font-weight: 600; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl tr.clickable { cursor: pointer; } .tbl tr.clickable:hover td { background: var(--sunken); }
.tbl td.r, .tbl th.r { text-align: right; }
.scroll { overflow-x: auto; }
.hex { font: 12px/1.6 var(--font-mono); color: var(--ink-2); white-space: pre; }

.uplot { font-family: var(--font-body); line-height: 1.5; width: min-content; }
.u-wrap { position: relative; user-select: none; }
.u-over, .u-under { position: absolute; }
.u-under { overflow: hidden; }
.uplot canvas { display: block; position: relative; width: 100%; height: 100%; }
.u-axis { position: absolute; }
.u-select { background: rgba(13,106,131,.08); position: absolute; pointer-events: none; }
.u-cursor-x, .u-cursor-y { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.u-hz .u-cursor-x { height: 100%; border-right: 1px solid var(--ink-3); }
.u-hz .u-cursor-y { width: 100%; border-bottom: 0; }
.u-cursor-pt { position: absolute; top: 0; left: 0; border-radius: 50%; border: 0 solid; pointer-events: none; will-change: transform; background-clip: padding-box !important; }
.u-axis.u-off, .u-select.u-off, .u-cursor-x.u-off, .u-cursor-y.u-off, .u-cursor-pt.u-off { display: none; }

.note { font-size: 13px; color: var(--ink-3); border-left: 3px solid var(--line); padding-left: 10px; max-width: 75ch; margin: 0; }
.proto { font-size: 12.5px; background: var(--accent-soft); color: var(--accent); padding: 8px 12px; border-radius: 8px; }
.empty { padding: 30px; text-align: center; color: var(--ink-2); align-items: center; }

/* detail level */
body[data-level="simple"] .lv-std, body[data-level="simple"] .lv-exp, body[data-level="standard"] .lv-exp { display: none !important; }
body:not([data-level="simple"]) .lv-simple { display: none !important; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mpicker { display: flex; gap: 6px; align-items: center; }
  .mpicker select { flex: 1; min-width: 0; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .g4, .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
  .ctl > span { display: none; }
  .shead h1 { font-size: 24px; }
  .navbtns { margin-left: 0; }
  .view3d canvas { height: 320px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
"use strict";
const D = window.TLM_DATA;

/* ---------- state ---------- */
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const state = {
  view: "sessions", sel: 15, tab: "overview",
  filter: store.get("tlm.filter", "flights"), level: store.get("tlm.level2", "simple"),
  lang: store.get("tlm.lang", "en"), details: store.get("tlm.details", "0") === "1",
  pathMode: "nogps", colorBy: "phase",
};
let charts = [];

/* ---------- language ---------- */
// Prototype i18n: every UI string is written as L(english, german). The real app would use message catalogues.
const L = (en, de) => state.lang === "de" ? de : en;
const W = (pair) => state.lang === "de" ? pair.de : pair.en;
const locale = () => state.lang === "de" ? "de-DE" : "en-GB";

/* ---------- formatting ---------- */
const pad = (n) => String(n).padStart(2, "0");

function analyse(s) {

function cmp(v, base, lowerBetter) {
  if (v == null || base == null) return "";
  const r = v / base;
  if (Math.abs(r - 1) < .07) return L("(as usual)", "(wie üblich)");
  return (lowerBetter ? r < 1 : r > 1) ? L("(better than usual)", "(besser als sonst)") : L("(worse than usual)", "(schlechter als sonst)");
}

// invented positions for the GPS preview: straight climbs into wind, gentle turns while gliding, turns home beyond 300 m
function simulatePath(a) {
  if (a._sim) return a._sim;
  const n = a.n, rad = Math.PI / 180;
  let X = 0, Y = 0, hd = 270 * rad, total = 0;
  const wind = [1.6, 0.4];
  const out = { x: [], y: [], dist: [], speed: [] };
  for (let i = 0; i < n; i++) {
    const k = a.phaseAt[i], air = k && k !== "ground";
    if (air) {
      const d = Math.hypot(X, Y);
      let turn = 0;
      if (d > 300) { const want = Math.atan2(-X, -Y); let diff = want - hd; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); turn = Math.max(-20 * rad, Math.min(20 * rad, diff)); }
      else if (k !== "motor") turn = (Math.floor(i / 28) % 2 ? 1 : -1) * 13 * rad;
      hd += turn;
      const v = k === "motor" ? 13 : 10.5;
      const dx = Math.sin(hd) * v + wind[0], dy = Math.cos(hd) * v + wind[1];
      X += dx; Y += dy; total += Math.hypot(dx, dy); out.speed.push(Math.hypot(dx, dy));
    } else out.speed.push(null);
    out.x.push(+X.toFixed(1)); out.y.push(+Y.toFixed(1)); out.dist.push(+Math.hypot(X, Y).toFixed(1));
  }
  out.total = total;
  a._sim = out;

}
// small hand-rolled orthographic 3D view (the app would use a map library with terrain)

  const ext = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), zmax * 1.4) * 0.75;

    for (let gy = g0y; gy <= cy + ext; gy += 100) { ctx.beginPath(); ctx.moveTo(...P(cx - ext, gy, 0)); ctx.lineTo(...P(cx + ext, gy, 0)); ctx.stroke(); }

    ctx.fillStyle = css("--ink-3"); ctx.font = `12px ${css("--font-body")}`; ctx.fillText(L("grid 100 m", "Raster 100 m"), 12, H - 10);
    if (marker != null) {

  }));

/* scatter (canvas) */
function scatter(el, pts, o) {
  const cv = el.querySelector("canvas");
  const draw = () => {
    const Wd = cv.clientWidth, H = 220, dpr = devicePixelRatio || 1; if (!Wd) return; cv.width = Wd * dpr; cv.height = H * dpr; cv.style.height = H + "px";
    const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, Wd, H);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const Lm = 50, R = 10, T = 8, B = 34, X = (v) => Lm + (v - x0) / (x1 - x0 || 1) * (Wd - Lm - R), Y = (v) => H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B);
    ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--ink-3"); ctx.font = `12px ${css("--font-body")}`; ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) { const yv = y0 + (y1 - y0) * k / 4, xv = x0 + (x1 - x0) * k / 4; ctx.beginPath(); ctx.moveTo(Lm, Y(yv)); ctx.lineTo(Wd - R, Y(yv)); ctx.stroke(); ctx.textAlign = "right"; ctx.fillText(f(yv, 1), Lm - 6, Y(yv) + 4); ctx.textAlign = "center"; ctx.fillText(f(xv, 0), X(xv), H - B + 16); }
    ctx.textAlign = "center"; ctx.fillText(o.xl, Lm + (Wd - Lm - R) / 2, H - 4);
    ctx.fillStyle = hexAlpha(css(o.color), .35); pts.forEach(([px, py]) => { ctx.beginPath(); ctx.arc(X(px), Y(py), 2.2, 0, 7); ctx.fill(); });
    if (o.fit) { const mx = xs.reduce((p, q) => p + q, 0) / xs.length, my = ys.reduce((p, q) => p + q, 0) / ys.length, k = -o.fit / 1000; ctx.strokeStyle = css("--ink"); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(x0), Y(my + k * (x0 - mx))); ctx.lineTo(X(x1), Y(my + k * (x1 - mx))); ctx.stroke(); }
    ctx.save(); ctx.translate(12, T + (H - T - B) / 2); ctx.rotate(-Math.PI / 2); ctx.fillStyle = css("--ink-3"); ctx.textAlign = "center"; ctx.fillText(o.yl, 0, 0); ctx.restore();
  };
  draw(); const rob = new ResizeObserver(draw); rob.observe(cv); charts.push({ u: { destroy() {} }, ro: rob });
}

/* ---------- batteries page ---------- */
function renderBatteries() {
  destroyCharts();
  let h = `<div class="sectionhead"><h2 style="font-size:28px">${L("Batteries", "Akkus")}</h2><p>${L("Smart batteries report their own ID and charge cycles, so every session can be linked to the pack that powered it.", "Smart-Akkus melden ihre eigene ID und Ladezyklen. So lässt sich jede Sitzung dem Akku zuordnen, der sie versorgt hat.")}</p></div>`;

  Object.values(BATT).forEach((b) => {
    const fl = b.sessions.filter((a) => a.type === "flight");

      <div class="scroll"><table class="tbl"><thead><tr><th>${L("Date", "Datum")}</th><th>${L("Session", "Sitzung")}</th><th class="r">${L("Cycles", "Zyklen")}</th><th class="r">${L("Charge used", "Verbrauch")}</th><th class="r lv-std">${L("Per cell start → end", "Pro Zelle Anfang → Ende")}</th><th>${L("Condition", "Zustand")}</th></tr></thead><tbody>
      ${b.sessions.map((a) => { const c = a.resistance != null && !a.cellsFrozen ? rate(a.resistance / (a.s.battery?.cells || 3), TH.battR) : null; return `<tr class="clickable" data-open="${a.s.index}"><td class="num">${dateShort(a.s.start)} ${timeOf(a.s.start)}</td><td>${typeName(a.type)}${a.cellsFrozen ? ` <b style="color:var(--crit)">· ${L("data stuck", "Daten eingefroren")}</b>` : ""}</td><td class="r num">${a.s.battery.cycles}</td><td class="r num">${f(a.mah, 0)} mAh</td><td class="r num lv-std">${f(a.cellStart, 2)} → ${f(a.cellEnd, 2)} V</td><td>${c ? meter(c.q) + " " + c.word : "–"}</td></tr>`; }).join("")}

  if (unknown.length) h += `<div class="card"><h3>${L("Flights with an unidentified battery", "Flüge mit unbekanntem Akku")}</h3><div class="hint">${L("No smart-battery data. Possibly the faulty pack after it stopped reporting, or a different battery.", "Keine Smart-Akku-Daten. Möglicherweise der defekte Akku, nachdem er aufgehört hat zu senden, oder ein anderer Akku.")}</div>
    <table class="tbl"><tbody>${unknown.map((a) => { const c = a.resistance ? rate(a.resistance / (a.s.battery?.cells || 3), TH.battR) : null; return `<tr class="clickable" data-open="${a.s.index}"><td class="num">${dateShort(a.s.start)} ${timeOf(a.s.start)}</td><td class="r num">${f(a.mah, 0)} mAh</td><td>${c ? meter(c.q) + " " + c.word : "–"}</td></tr>`; }).join("")}</tbody></table></div>`;
  h += `<p class="note">${L("Condition compares the voltage drop under load between flights. On 7 Nov the drop was about twice as large as on 10 Oct. That fits the battery that later stopped reporting.", "Der Zustand vergleicht den Spannungseinbruch unter Last zwischen den Flügen. Am 7.11. war er etwa doppelt so groß wie am 10.10. Das passt zu dem Akku, der danach keine Daten mehr gesendet hat.")}</p>`;
  const m = document.getElementById("main"); m.innerHTML = h;
  m.querySelectorAll("[data-open]").forEach((r) => r.addEventListener("click", () => { state.tab = "battery"; select(+r.dataset.open); }));
}

/* ---------- inventory page ---------- */
function renderInventory() {
  destroyCharts();
  const kinds = {}; A.forEach((a) => kinds[a.type] = (kinds[a.type] || 0) + 1);
  let h = `<div class="sectionhead"><h2 style="font-size:28px">${L("Data inventory", "Dateninventar")}</h2><p>${L("Everything found in the file, including the parts that are not understood yet.", "Alles, was in der Datei steckt, auch die Teile, die noch nicht verstanden sind.")}</p></div>`;
  h += `<div class="grid g4">${tile(L("File", "Datei"), esc(D.file.name), "", `${f(D.file.size / 1e6, 1)} MB`)}${tile(L("Sessions", "Sitzungen"), D.file.sessions, "", L(`${kinds.flight || 0} flights · ${kinds.ground || 0} ground tests · ${kinds.power || 0} powered on · ${kinds.clock || 0} transmitter only`, `${kinds.flight || 0} Flüge · ${kinds.ground || 0} Bodentests · ${kinds.power || 0} eingeschaltet · ${kinds.clock || 0} nur Sender`))}${tile(L("Sensor streams", "Sensordatenströme"), D.fileInventory.length, "", L(`${D.fileInventory.filter((s) => s.level !== "known").length} not fully understood`, `${D.fileInventory.filter((s) => s.level !== "known").length} nicht ganz verstanden`))}${tile("GPS", L("none", "keins"), "", L("A GPS sensor adds map, distance and speed", "Ein GPS-Sensor bringt Karte, Entfernung und Geschwindigkeit"))}</div>`;
  h += inventoryTable(D.fileInventory, "f");
  h += `<div class="card"><h3>${L("All sessions", "Alle Sitzungen")}</h3><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>${L("Start", "Beginn")}</th><th>${L("Kind", "Art")}</th><th class="r">${L("Duration", "Dauer")}</th><th class="r">${L("Max height", "Max. Höhe")}</th><th class="r">${L("Records", "Datensätze")}</th></tr></thead><tbody>${A.map((a) => `<tr class="clickable" data-open="${a.s.index}"><td class="num">${a.s.index}</td><td class="num">${a.s.start ? dateShort(a.s.start) + " " + a.s.start.slice(11, 19) : "–"}</td><td>${typeName(a.type)}</td><td class="r num">${dur(a.s.duration)}</td><td class="r num">${a.maxAlt != null ? f(a.maxAlt, 1) + " m" : "–"}</td><td class="r num">${a.s.records}</td></tr>`).join("")}</tbody></table></div></div>`;
  const m = document.getElementById("main"); m.innerHTML = h;
  wireCommon(m);
  m.querySelectorAll("[data-open]").forEach((r) => r.addEventListener("click", () => { state.filter = "all"; store.set("tlm.filter", "all"); state.tab = "overview"; select(+r.dataset.open); }));
}

/* ---------- help ---------- */
const ST = { ok: ["--good", "Tested", "Getestet"], exp: ["--warn", "Expected to work, not tested yet", "Sollte funktionieren, noch ungetestet"], spec: ["--warn", "Built from the specification, not tested yet", "Nach Spezifikation gebaut, noch ungetestet"], raw: ["--ink-3", "Shown as raw data for now", "Vorerst als Rohdaten"], part: ["--warn", "Partly understood", "Teilweise verstanden"] };
const stLabel = (k) => `<span class="st"><span class="kdot" style="background:var(${ST[k][0]})"></span>${L(ST[k][1], ST[k][2])}</span>`;
function helpHtml() {
  const radios = [
    [L("Spektrum NX6, NX8, NX10 (incl. “+” versions)", "Spektrum NX6, NX8, NX10 (auch „+“-Versionen)"), L("Internal storage: <code>&lt;Model&gt;.TLM</code> and the <code>AutoLog</code> folder. Copy via USB.", "Interner Speicher: <code>&lt;Modell&gt;.TLM</code> und Ordner <code>AutoLog</code>. Per USB kopieren."), "ok"],
    [L("Spektrum iX12, iX14, iX20", "Spektrum iX12, iX14, iX20"), L("Internal storage, copy via USB.", "Interner Speicher, per USB kopieren."), "exp"],
    [L("Spektrum DX6 G2/G3, DX7 G2, DX8 G2, DX9, DX10t, DX18 (G2 and later), DX18t, DX20", "Spektrum DX6 G2/G3, DX7 G2, DX8 G2, DX9, DX10t, DX18 (ab G2), DX18t, DX20"), L("SD card, once telemetry logging is switched on in the transmitter.", "SD-Karte, wenn das Telemetrie-Logging im Sender eingeschaltet ist."), "exp"],
  ];
  const data = [
    [L("Radio link: frame losses, holds, fades, receiver voltage, signal strength", "Funkverbindung: Frame Losses, Holds, Fades, Empfängerspannung, Signalstärke"), L("Any Spektrum telemetry receiver (model names ending in “T”)", "Jeder Spektrum-Telemetrieempfänger (Modellname endet auf „T“)"), "ok"],
    [L("Motor, controller and BEC: rpm, current, voltage, throttle, temperatures", "Motor, Regler und BEC: Drehzahl, Strom, Spannung, Gas, Temperaturen"), L("Spektrum Smart ESC (e.g. Avian)", "Spektrum Smart-Regler (z. B. Avian)"), "ok"],
    [L("Battery: cell voltages, temperature, ID, charge cycles, capacity", "Akku: Zellspannungen, Temperatur, ID, Ladezyklen, Kapazität"), L("Spektrum Smart battery, connected through a Smart ESC", "Spektrum Smart-Akku, angeschlossen über einen Smart-Regler"), "ok"],
    [L("Height and climb rate", "Höhe und Steigrate"), L("Vario / altimeter sensor, or a receiver that reports it", "Vario- / Höhensensor oder ein Empfänger, der sie meldet"), "ok"],
    [L("Loads (g) and rotation rates", "Lasten (g) und Drehraten"), L("Receiver with AS3X / SAFE", "Empfänger mit AS3X / SAFE"), "ok"],
    [L("Flight mode", "Flugmodus"), L("Receiver with AS3X / SAFE", "Empfänger mit AS3X / SAFE"), "part"],
    [L("Map, distance, speed over ground", "Karte, Entfernung, Geschwindigkeit über Grund"), L("Spektrum GPS telemetry sensor", "Spektrum GPS-Telemetriesensor"), "spec"],
    [L("Other sensors (airspeed, extra current or temperature sensors, …)", "Weitere Sensoren (Fahrtmesser, zusätzliche Strom- oder Temperatursensoren, …)"), L("X-Bus / SRXL2 sensors", "X-Bus- / SRXL2-Sensoren"), "raw"],
  ];
  return `<div class="hd"><h2 id="helpTitle">${L("Who can use tlmscope", "Für wen ist tlmscope?")}</h2><button class="btn" id="helpClose">${L("Close", "Schließen")}</button></div>
  <div class="bd">
    <p>${L("tlmscope shows what happened during your flights. It reads the telemetry logs (<code>.TLM</code> files) that Spektrum transmitters save, and turns them into flight summaries, charts and simple ratings.",
      "tlmscope zeigt, was bei deinen Flügen passiert ist. Es liest die Telemetrie-Logs (<code>.TLM</code>-Dateien), die Spektrum-Sender speichern, und macht daraus Flugzusammenfassungen, Diagramme und einfache Bewertungen.")}</p>
    <p><b>${L("You can use it if", "Du kannst es nutzen, wenn")}</b> ${L("you fly a model with a Spektrum telemetry receiver and your Spektrum transmitter saves telemetry logs.", "du ein Modell mit Spektrum-Telemetrieempfänger fliegst und dein Spektrum-Sender Telemetrie-Logs speichert.")}</p>
    <h3>${L("Transmitters", "Sender")}</h3>
    <div class="scroll"><table class="tbl"><thead><tr><th>${L("Transmitter", "Sender")}</th><th>${L("Where the logs are", "Wo die Logs liegen")}</th><th>${L("Status", "Status")}</th></tr></thead><tbody>${radios.map(([r, w, s]) => `<tr><td>${r}</td><td>${w}</td><td>${stLabel(s)}</td></tr>`).join("")}</tbody></table></div>
    <h3>${L("What you can see, and what it needs", "Was du sehen kannst und was dafür nötig ist")}</h3>
    <p class="hint">${L("A log only contains what the sensors in your model sent. Missing hardware means missing data, not an error.", "Ein Log enthält nur, was die Sensoren im Modell gesendet haben. Fehlt Hardware, fehlen Daten. Das ist kein Fehler.")}</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>${L("Data", "Daten")}</th><th>${L("Needs", "Benötigt")}</th><th>${L("Status", "Status")}</th></tr></thead><tbody>${data.map(([d, n, s]) => `<tr><td>${d}</td><td>${n}</td><td>${stLabel(s)}</td></tr>`).join("")}</tbody></table></div>
    <h3>${L("Not supported", "Nicht unterstützt")}</h3>
    <ul>
      <li>${L("EdgeTX / OpenTX logs (CSV, e.g. RadioMaster, FrSky, ExpressLRS, Crossfire): <b>planned</b>, not available yet.", "Logs von EdgeTX / OpenTX (CSV, z. B. RadioMaster, FrSky, ExpressLRS, Crossfire): <b>geplant</b>, noch nicht verfügbar.")}</li>
      <li>${L("Other radio systems with their own log formats (Jeti, Graupner HoTT, Futaba, Multiplex …).", "Andere Fernsteuersysteme mit eigenen Log-Formaten (Jeti, Graupner HoTT, Futaba, Multiplex …).")}</li>
      <li>${L("Flight controller logs (ArduPilot, Betaflight blackbox, iNav).", "Logs von Flugsteuerungen (ArduPilot, Betaflight Blackbox, iNav).")}</li>
      <li>${L("Spektrum transmitters that cannot save telemetry logs (e.g. DX6i).", "Spektrum-Sender, die keine Telemetrie-Logs speichern können (z. B. DX6i).")}</li>
      <li>${L("Live telemetry during the flight. tlmscope works with the saved files afterwards.", "Live-Telemetrie während des Flugs. tlmscope arbeitet nachträglich mit den gespeicherten Dateien.")}</li>
      <li>${L("Changing settings on the transmitter or receiver. tlmscope only reads.", "Einstellungen an Sender oder Empfänger ändern. tlmscope liest nur.")}</li>
      <li>${L("Cars and boats (Spektrum surface radios) are not a focus. Their logs may partly work.", "Autos und Boote (Spektrum-Bodensender) stehen nicht im Fokus. Deren Logs funktionieren eventuell teilweise.")}</li>
    </ul>
    <h3>${L("Your data stays with you", "Deine Daten bleiben bei dir")}</h3>
    <p>${L("Files are read in your browser. Nothing is uploaded.", "Dateien werden in deinem Browser gelesen. Nichts wird hochgeladen.")}</p>
    <h3>${L("How to get your log files", "So kommst du an deine Log-Dateien")}</h3>
    <ul>
      <li>${L("NX and iX: connect the transmitter by USB, choose the option to access internal storage in the USB settings, then copy the <code>.TLM</code> files.", "NX und iX: Sender per USB anschließen, in den USB-Einstellungen den Zugriff auf den internen Speicher wählen, dann die <code>.TLM</code>-Dateien kopieren.")}</li>
      <li>${L("DX with SD card: take the SD card out and copy the <code>.TLM</code> files.", "DX mit SD-Karte: Karte entnehmen und die <code>.TLM</code>-Dateien kopieren.")}</li>
    </ul>
    <p class="note">${L("tlmscope is an independent project, not made or endorsed by Spektrum or Horizon Hobby.", "tlmscope ist ein unabhängiges Projekt und wird nicht von Spektrum oder Horizon Hobby hergestellt oder unterstützt.")}</p>
  </div>`;
}
function openHelp() {
  const d = document.getElementById("helpDlg");
  d.innerHTML = helpHtml();
  d.querySelector("#helpClose").addEventListener("click", () => d.close());
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}

/* ---------- navigation ---------- */
function select(i) { state.sel = i; if (state.filter === "flights" && A[i].type !== "flight") state.filter = "all"; go("session-" + i); }
function step(d) { const v = visibleSessions(), p = v.findIndex((a) => a.s.index === state.sel); const nx = v[Math.max(0, Math.min(v.length - 1, (p < 0 ? 0 : p) + d))]; if (nx) select(nx.s.index); }
function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else route(); }
function applyChrome() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { const [en, de] = el.dataset.i18n.split("|"); el.textContent = L(en, de); });
  document.querySelectorAll("[data-nav]").forEach((a) => a.setAttribute("aria-current", a.dataset.nav === state.view ? "page" : "false"));
  document.body.dataset.level = state.level;
  document.querySelectorAll("#levelSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.level === state.level));
  document.querySelectorAll("#langSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
  document.getElementById("detailsBtn").setAttribute("aria-pressed", state.details);
}
function route() {
  const h = location.hash.slice(1) || "session-" + state.sel;
  const m = /^session-(\d+)$/.exec(h);
  if (m && A[+m[1]]) { state.view = "sessions"; state.sel = +m[1]; }
  else if (h === "sessions") state.view = "sessions";
  else if (h === "batteries" || h === "inventory") state.view = h;
  applyChrome();
  renderList();
  if (state.view === "batteries") renderBatteries();
  else if (state.view === "inventory") renderInventory();
  else renderSession();
  const d = document.getElementById("helpDlg"); if (d.open) d.innerHTML = helpHtml(), d.querySelector("#helpClose").addEventListener("click", () => d.close());
}
document.querySelectorAll("#levelSeg button").forEach((b) => b.addEventListener("click", () => { state.level = b.dataset.level; store.set("tlm.level2", state.level); route(); }));
document.querySelectorAll("#langSeg button").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; store.set("tlm.lang", state.lang); route(); }));
document.getElementById("detailsBtn").addEventListener("click", () => {
  state.details = !state.details; store.set("tlm.details", state.details ? "1" : "0");
  applyChrome();
  document.querySelectorAll("details.more").forEach((d) => { d.open = state.details; });
  document.querySelectorAll("tr[data-toggle]").forEach((tr) => { const d = document.getElementById(tr.dataset.toggle); if (d) d.hidden = !state.details; });
});
document.getElementById("helpBtn").addEventListener("click", openHelp);
document.querySelectorAll("#filterSeg button").forEach((b) => b.addEventListener("click", () => { state.filter = b.dataset.filter; store.set("tlm.filter", state.filter); renderList(); }));
document.addEventListener("keydown", (e) => {
  if (state.view !== "sessions" || e.target.closest("input,select,textarea") || document.getElementById("helpDlg").open) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
window.addEventListener("hashchange", route);
const drop = document.getElementById("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
document.getElementById("fileName").textContent = D.file.name;
document.getElementById("fileSize").textContent = (D.file.size / 1e6).toFixed(1) + " MB";
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", route);
new MutationObserver(route).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
route();
</script>
