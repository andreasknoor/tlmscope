<title>tlmscope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Sticky top bar, session list on the left (horizontal picker on phones), session view on the right. */
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --sunken: #f5f8f9;
  --ink: #13212a;
  --ink-2: #4f606a;
  --ink-3: #7b8b94;
  --line: #d8e1e5;
  --grid: #e7edf0;
  --accent: #0d6a83;
  --accent-soft: #dcedf2;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --s-alt: #2a78d6;
  --s-motor: #eb6834;
  --s-lift: #1baf7a;
  --s-glide: #a9b6bd;
  --s-ground: #d6dee2;
  --s-4: #e87ba4;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #151f25; --sunken: #111a1f; --ink: #e4ecef; --ink-2: #a3b3bb; --ink-3: #74858e;
    --line: #25333b; --grid: #1e2a31; --accent: #52b6d2; --accent-soft: #17323b;
    --s-alt: #3987e5; --s-motor: #d95926; --s-lift: #199e70; --s-glide: #5b6a72; --s-ground: #2b383f; --s-4: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #151f25; --sunken: #111a1f; --ink: #e4ecef; --ink-2: #a3b3bb; --ink-3: #74858e;
  --line: #25333b; --grid: #1e2a31; --accent: #52b6d2; --accent-soft: #17323b;
  --s-alt: #3987e5; --s-motor: #d95926; --s-lift: #199e70; --s-glide: #5b6a72; --s-ground: #2b383f; --s-4: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 700 22px/1 var(--font-display); letter-spacing: .02em; }
.brand span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 6px; font-weight: 600; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sunken); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
.levelctl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; }

/* shell */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100% - 56px); }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 12px 24px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.main { padding-block: 18px 40px; padding-left: max(16px, 24px); padding-right: max(16px, env(safe-area-inset-right, 0px), 24px); min-width: 0; display: flex; flex-direction: column; gap: 16px; }

.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--sunken); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .file { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.drop small { color: var(--ink-3); }
.sidehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sidehead h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.slist { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sday { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 10px 8px 4px; }
.sitem { display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.sitem:hover { background: var(--sunken); }
.sitem[aria-current="true"] { background: var(--accent-soft); }
.sitem .t { font: 600 16px/1 var(--font-display); }
.sitem .k { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.sitem .m { font-size: 12.5px; color: var(--ink-3); text-align: right; }
.sitem canvas { grid-column: 2 / 4; width: 100%; height: 16px; }
.sitem.dim .t, .sitem.dim .k { color: var(--ink-3); }
.kdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.keys { font-size: 12px; color: var(--ink-3); }
kbd { font: 500 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--sunken); }
.mpicker { display: none; }

/* session header */
.shead { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.shead h1 { font-size: 30px; line-height: 1.05; }
.shead .sub { color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.navbtns { display: flex; gap: 6px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--sunken); border: 1px solid var(--line); color: var(--ink-2); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.summary { font-size: 18px; line-height: 1.5; max-width: 70ch; color: var(--ink); }
.summary b { font-weight: 700; }

.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card h3 { font-size: 17px; }
.card .hint { font-size: 13.5px; color: var(--ink-2); }
.tile .v { font: 600 32px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 16px; color: var(--ink-2); margin-left: 3px; font-weight: 500; }
.tile .l { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.sectionhead { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.sectionhead h2 { font-size: 20px; }
.sectionhead p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* rating card */
.rating { gap: 6px; }
.rating .top3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rating .name { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.rating .word { font: 600 22px/1.1 var(--font-display); }
.meter { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; flex: none; }
.meter i { width: 6px; border-radius: 2px; background: var(--grid); }
.meter i:nth-child(1) { height: 7px; } .meter i:nth-child(2) { height: 10px; } .meter i:nth-child(3) { height: 14px; } .meter i:nth-child(4) { height: 18px; }
.meter.neutral i.on { background: var(--ink-2); }
details.more { font-size: 13.5px; color: var(--ink-2); }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+ "; }
details.more[open] summary::before { content: "− "; }
.kv { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin-top: 6px; justify-content: start; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; color: var(--ink); }
.alert { border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); }
.alert .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 13px; }
.alert b { display: block; }

/* charts */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 10px 4px; min-width: 0; }
.chart .ch { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 4px 4px; flex-wrap: wrap; }
.chart .ch b { font: 600 16px var(--font-display); }
.chart .ch .ro { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart .plot { width: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 2px 4px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 3px; border-radius: 2px; }
.striplabel { font-size: 12.5px; color: var(--ink-2); padding: 6px 4px 0; display: flex; justify-content: space-between; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl tr.clickable { cursor: pointer; } .tbl tr.clickable:hover td { background: var(--sunken); }
.tbl td.r, .tbl th.r { text-align: right; }
.scroll { overflow-x: auto; }
.hex { font: 12px/1.6 var(--font-mono); color: var(--ink-2); white-space: pre; }

.uplot { font-family: var(--font-body); line-height: 1.5; width: min-content; }
.u-wrap { position: relative; user-select: none; }
.u-over, .u-under { position: absolute; }
.u-under { overflow: hidden; }
.uplot canvas { display: block; position: relative; width: 100%; height: 100%; }
.u-axis { position: absolute; }
.u-select { background: rgba(13,106,131,.08); position: absolute; pointer-events: none; }
.u-cursor-x, .u-cursor-y { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.u-hz .u-cursor-x { height: 100%; border-right: 1px solid var(--ink-3); }
.u-hz .u-cursor-y { width: 100%; border-bottom: 0; }
.u-cursor-pt { position: absolute; top: 0; left: 0; border-radius: 50%; border: 0 solid; pointer-events: none; will-change: transform; background-clip: padding-box !important; }
.u-axis.u-off, .u-select.u-off, .u-cursor-x.u-off, .u-cursor-y.u-off, .u-cursor-pt.u-off { display: none; }

.note { font-size: 13px; color: var(--ink-3); border-left: 3px solid var(--line); padding-left: 10px; max-width: 75ch; }
.proto { font-size: 12.5px; background: var(--accent-soft); color: var(--accent); padding: 8px 12px; border-radius: 8px; }
.empty { padding: 30px; text-align: center; color: var(--ink-2); }

/* detail level */
body[data-level="simple"] .lv-std, body[data-level="simple"] .lv-exp, body[data-level="standard"] .lv-exp { display: none !important; }
body:not([data-level="simple"]) .lv-simple { display: none !important; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mpicker { display: flex; gap: 6px; align-items: center; }
  .mpicker select { flex: 1; min-width: 0; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .g4, .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
  .levelctl span { display: none; }
  .shead h1 { font-size: 24px; }
  .navbtns { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
"use strict";
const D = window.TLM_DATA;

/* ---------- formatting ---------- */
const pad = (n) => String(n).padStart(2, "0");
const clock = (s) => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
const dur = (s) => s >= 60 ? `${Math.floor(s / 60)}:${pad(Math.round(s % 60))} min` : `${s.toFixed(1)} s`;
const durWords = (s) => s >= 90 ? `${(s / 60).toFixed(1)} minutes` : `${Math.round(s)} seconds`;
const f = (v, d = 1) => v == null || Number.isNaN(v) ? "–" : v.toFixed(d);
const timeOf = (iso) => iso ? iso.slice(11, 16) : "–";
const dayOf = (iso) => new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sum = (a) => a.reduce((x, y) => x + (y || 0), 0);
const valid = (a) => a.filter((v) => v != null);
const max = (a) => { const v = valid(a); return v.length ? Math.max(...v) : null; };
const min = (a) => { const v = valid(a); return v.length ? Math.min(...v) : null; };
const median = (a) => { const v = valid(a).sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : null; };

/* ---------- the four-step scale used by every rating ---------- */
// q = 4 best ... 1 worst. Each metric brings its own words.
const LEVEL_COLOR = { 4: "--good", 3: "--good", 2: "--warn", 1: "--crit" };
function meter(q, neutral) {
  const c = neutral ? "" : `style="--on:var(${LEVEL_COLOR[q]})"`;
  return `<span class="meter ${neutral ? "neutral" : ""}" aria-hidden="true">${[1, 2, 3, 4].map((k) =>
    `<i class="${k <= q ? "on" : ""}" ${k <= q && !neutral ? `style="background:var(${LEVEL_COLOR[q]})${q === 3 ? ";opacity:.55" : ""}"` : ""}></i>`).join("")}</span>`;
}
function rate(value, steps, words) {
  // steps: thresholds for q4,q3,q2 (higher-is-better if steps descending)
  if (value == null) return null;
  const hib = steps[0] > steps[2];
  let q = 1;
  for (let k = 0; k < 3; k++) if (hib ? value >= steps[k] : value <= steps[k]) { q = 4 - k; break; }
  return { q, word: words[4 - q] };
}

/* ---------- analysis (prototype logic; the real app does this in the decoder module) ---------- */
const TH = {
  signal: { steps: [-70, -85, -92], words: ["High", "Normal", "Weak", "Critical"], unit: "dBm" },
  link: { steps: [3, 10, 25], words: ["High", "Normal", "Weak", "Critical"] },
  battR: { steps: [25, 40, 60], words: ["Good", "OK", "Tired", "Check"] },
  fet: { steps: [50, 70, 85], words: ["Cool", "Warm", "Hot", "Too hot"] },
  battT: { steps: [40, 50, 60], words: ["Cool", "Warm", "Hot", "Too hot"] },
  rx: { steps: [5.6, 5.2, 4.8], words: ["Steady", "OK", "Dips", "Brown-out risk"] },
  used: { steps: [50, 70, 80], words: ["Plenty left", "Fine", "Land soon", "Over-drawn"] },
  eff: { steps: [1.1, 0.9, 0.7], words: ["Better than usual", "Typical", "Below usual", "Much lower"] },
};
const PHASES = {
  ground: { label: "On ground", color: "--s-ground" },
  motor: { label: "Motor climb", color: "--s-motor" },
  glide: { label: "Gliding", color: "--s-glide" },
  lift: { label: "Lift (thermal)", color: "--s-lift" },
};
const LIPO = [[3.5, 0], [3.68, 10], [3.73, 20], [3.77, 30], [3.8, 40], [3.84, 50], [3.87, 60], [3.92, 70], [3.97, 80], [4.06, 90], [4.2, 100]];
function lipoPct(v) {
  if (v == null) return null;
  if (v <= LIPO[0][0]) return 0; if (v >= 4.2) return 100;
  for (let i = 1; i < LIPO.length; i++) if (v <= LIPO[i][0]) {
    const [v0, p0] = LIPO[i - 1], [v1, p1] = LIPO[i];
    return p0 + (p1 - p0) * (v - v0) / (v1 - v0);
  }
}

function analyse(s) {
  const r = { s, type: "clock" };
  const x = s.series;
  if (!x) return r;
  const n = x.alt.length;
  r.n = n;
  r.t = Array.from({ length: n }, (_, i) => i);
  r.motor = r.t.map((i) => (x.thr[i] || 0) > 5 || (x.amps[i] || 0) > 1);
  r.maxAlt = max(x.alt);
  r.motorSecs = r.motor.filter(Boolean).length;
  r.type = r.maxAlt > 10 ? "flight" : r.motorSecs > 0 ? "ground" : "power";
  r.mah = sum(x.amps) / 3.6;
  r.maxAmps = max(x.ampsMax);
  r.frameLosses = sum(x.fl);
  r.holds = sum(x.holds);
  r.fades = sum(x.fades);

  // smoothed climb (9 s window) for lift detection
  const sm = r.t.map((i) => { let a = 0, c = 0; for (let k = i - 4; k <= i + 4; k++) if (x.climb[k] != null) { a += x.climb[k]; c++; } return c ? a / c : 0; });
  r.smClimb = sm;
  let first = x.alt.findIndex((v) => v != null && v > 3), last = n - 1 - [...x.alt].reverse().findIndex((v) => v != null && v > 3);
  if (r.type !== "flight") { first = n; last = -1; }
  // a motor pause of up to 5 s still counts as the same climb
  const motorM = r.motor.slice();

  h += `<div class="lv-std">${chartBox("c-fl", "Frame losses per second")}</div>`;
  h += chartBox("c-alt3", "Height, for comparison");
  if (a.type === "flight") h += `<div class="lv-exp"><div class="chart" id="c-sigalt"><div class="ch"><b>Signal vs. height</b><span class="ro">each dot = 1 s</span></div><canvas class="plot" height="220"></canvas></div></div>`;
  h += `<p class="note">Height is the only distance hint without GPS: higher usually means farther away. With a GPS sensor this view would show signal against real distance.</p>`;
  return h;
}

/* aircraft */
function tabAircraft(a) {
  let h = `<div class="grid g4">${ratingsFor(a).split('<div class="card rating">').slice(5, 8).map((x) => '<div class="card rating">' + x).join("")}${tile("Flight mode", a.modes.length ? a.modes.map((m) => m + 1).join(", ") : "–", "", "Mode switch positions used (unverified)")}</div>`;
  h += chartBox("c-temp", "Temperatures", legend([["--s-motor", "Controller", 1], ["--s-alt", "BEC", 1], ...(a.battTMax != null ? [["--s-lift", "Battery", 1]] : [])]));
  h += `<div class="lv-std">${chartBox("c-rx", "Receiver power", legend([["--s-alt", "Receiver", 1], ["--s-motor", "BEC output", 1]]))}</div>`;
  h += `<div class="lv-std">${chartBox("c-g", "Load (total g)")}</div>`;
  h += `<div class="lv-exp">${stripBox("s-fm", "Flight mode over time", "colour = mode 1 / 2 / 4")}</div>`;
  return h;
}

/* raw data */
function tabRaw(a) {
  let h = `<div class="sectionhead"><h2>Sensors in this session</h2><p>Click a row for fields and raw packets.</p></div>`;
  h += inventoryTable(a.s.inventory, "r" + a.s.index);
  h += `<div class="card"><h3>Header blocks</h3><div class="hint">Model name and enabled sensors as stored by the transmitter. Bytes after the sensor pair look like alarm settings (unverified).</div><div class="scroll"><div class="hex">${a.s.headers.map(esc).join("\n")}</div></div></div>`;
  return h;
}
const LV = { known: ["Understood", "--good"], partial: ["Partly understood", "--warn"], unknown: ["Not understood", "--crit"] };
function inventoryTable(inv, pfx) {
  let h = `<div class="card scroll"><table class="tbl"><thead><tr><th>Sensor</th><th>ID</th><th>Status</th><th class="r">Records</th><th class="r">Per second</th><th class="r">No data</th></tr></thead><tbody>`;
  inv.forEach((st, k) => {
    const id = `${pfx}-${k}`;
    h += `<tr class="clickable" data-toggle="${id}"><td><b>${esc(st.name)}</b><br><span class="hint">${esc(st.desc)}</span></td><td class="mono">0x${st.key}</td><td><span class="pill"><span class="kdot" style="background:var(${LV[st.level][1]})"></span>${LV[st.level][0]}</span></td><td class="r">${st.count.toLocaleString("en")}</td><td class="r">${st.rate ?? "–"}</td><td class="r">${f(st.noData * 100, 0)} %</td></tr>
      <tr id="${id}" hidden><td colspan="6" style="background:var(--sunken)">
        ${st.fields.length ? `<table class="tbl"><thead><tr><th>Field</th><th class="r">Min</th><th class="r">Max</th><th>Unit</th><th class="r">No data</th></tr></thead><tbody>${st.fields.map((fl) => `<tr><td>${esc(fl.name)}</td><td class="r">${fl.min ?? "–"}</td><td class="r">${fl.max ?? "–"}</td><td>${esc(fl.unit)}</td><td class="r">${f(fl.noData * 100, 0)} %</td></tr>`).join("")}</tbody></table>` : `<div class="hint">No decoder yet.</div>`}
        <div class="hint" style="margin-top:8px">Most common raw packets (16 bytes):</div>
        <div class="hex">${st.samples.map((s) => `${String(s.count).padStart(6)}×  ${s.hex}`).join("\n")}</div></td></tr>`;
  });
  return h + `</tbody></table></div>`;
}

/* scatter (canvas) */
function scatter(el, pts, o) {
  const cv = el.querySelector("canvas"); const draw = () => {
    const W = cv.clientWidth, H = 220, dpr = devicePixelRatio || 1; cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const L = 50, R = 10, T = 8, B = 34, X = (v) => L + (v - x0) / (x1 - x0 || 1) * (W - L - R), Y = (v) => H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B);
    ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--ink-3"); ctx.font = `12px ${css("--font-body")}`; ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) { const yv = y0 + (y1 - y0) * k / 4, xv = x0 + (x1 - x0) * k / 4; ctx.beginPath(); ctx.moveTo(L, Y(yv)); ctx.lineTo(W - R, Y(yv)); ctx.stroke(); ctx.textAlign = "right"; ctx.fillText(yv.toFixed(1), L - 6, Y(yv) + 4); ctx.textAlign = "center"; ctx.fillText(xv.toFixed(0), X(xv), H - B + 16); }
    ctx.textAlign = "center"; ctx.fillText(o.xl, L + (W - L - R) / 2, H - 4);
    ctx.fillStyle = hexAlpha(css(o.color), .35); pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(X(x), Y(y), 2.2, 0, 7); ctx.fill(); });
    if (o.fit) { const mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length, k = -o.fit / 1000; ctx.strokeStyle = css("--ink"); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(x0), Y(my + k * (x0 - mx))); ctx.lineTo(X(x1), Y(my + k * (x1 - mx))); ctx.stroke(); }
    ctx.save(); ctx.translate(12, T + (H - T - B) / 2); ctx.rotate(-Math.PI / 2); ctx.fillStyle = css("--ink-3"); ctx.textAlign = "center"; ctx.fillText(o.yl, 0, 0); ctx.restore();
  };
  draw(); const rob = new ResizeObserver(draw); rob.observe(cv); charts.push({ u: { destroy() {} }, ro: rob });
}

/* ---------- batteries page ---------- */
function renderBatteries() {
  destroyCharts();
  let h = `<div class="sectionhead"><h2 style="font-size:28px">Batteries</h2><p>Smart batteries report their own ID and charge cycles, so every session can be linked to the pack that powered it.</p></div>`;
  h += `<div class="proto">Prototype: names (Battery A, B …) are given in order of first use. The real app would let you rename them, e.g. “Blue #2”.</div>`;
  Object.values(BATT).forEach((b) => {
    const fl = b.sessions.filter((a) => a.type === "flight");
    const rs = fl.map((a) => a.cellsFrozen ? null : a.resistance).filter((v) => v != null);
    const cond = rs.length ? rate(median(rs), TH.battR.steps, TH.battR.words) : null;
    const stuck = b.sessions.some((a) => a.cellsFrozen);
    h += `<div class="card"><div class="sectionhead"><h3 style="font-size:22px">${b.name}</h3><span class="pill">${b.chem} · ${b.cells}S · ${b.capacity} mAh</span></div>
      <div class="grid g4">${tile("Charge cycles", Math.max(...b.sessions.map((a) => a.s.battery.cycles)), "", "as reported by the pack")}${tile("Flights", fl.length, "", `${b.sessions.length} sessions in total`)}
      ${ratingCard("Condition", cond, cond ? "Median of its flights." : "Not enough data.")}
      ${ratingCard("Data quality", stuck ? { q: 1, word: "Stuck data seen" } : b.sessions.some((a) => !a.hasCells) ? { q: 2, word: "Partial data" } : { q: 4, word: "Reliable" }, stuck ? "Sent frozen cell voltages at least once. Possibly a faulty pack." : b.sessions.every((a) => !a.hasCells) ? "Identifies itself but never sends cell voltages." : "Readings looked plausible.")}</div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Session</th><th class="r">Cycles</th><th class="r">Charge used</th><th class="r lv-std">Per cell start → end</th><th>Condition</th></tr></thead><tbody>
      ${b.sessions.map((a) => { const c = a.resistance != null && !a.cellsFrozen ? rate(a.resistance, TH.battR.steps, TH.battR.words) : null; return `<tr class="clickable" data-open="${a.s.index}"><td class="num">${a.s.start.slice(0, 10).split("-").reverse().join(".")} ${timeOf(a.s.start)}</td><td>${TYPE[a.type].label}${a.cellsFrozen ? ' <b style="color:var(--crit)">· data stuck</b>' : ""}</td><td class="r num">${a.s.battery.cycles}</td><td class="r num">${f(a.mah, 0)} mAh</td><td class="r num lv-std">${f(a.cellStart, 2)} → ${f(a.cellEnd, 2)} V</td><td>${c ? meter(c.q) + " " + c.word : "–"}</td></tr>`; }).join("")}
      </tbody></table></div></div>`;
  });
  const unknown = A.filter((a) => a.type === "flight" && !a.s.battery);
  if (unknown.length) h += `<div class="card"><h3>Flights with an unidentified battery</h3><div class="hint">No smart-battery data. Possibly the faulty pack after it stopped reporting, or a different battery.</div>
    <table class="tbl"><tbody>${unknown.map((a) => `<tr class="clickable" data-open="${a.s.index}"><td class="num">${a.s.start.slice(0, 10).split("-").reverse().join(".")} ${timeOf(a.s.start)}</td><td class="r num">${f(a.mah, 0)} mAh</td><td>${a.resistance ? meter(rate(a.resistance, TH.battR.steps, TH.battR.words).q) + " " + rate(a.resistance, TH.battR.steps, TH.battR.words).word : "–"}</td></tr>`).join("")}</tbody></table></div>`;
  h += `<p class="note">Condition compares voltage drop under load between flights. On 7 Nov the drop was about twice as large as on 10 Oct. That fits the battery that later stopped reporting.</p>`;
  const m = document.getElementById("main"); m.innerHTML = h;
  m.querySelectorAll("[data-open]").forEach((r) => r.addEventListener("click", () => { state.tab = "battery"; select(+r.dataset.open); }));
}

/* ---------- inventory page ---------- */
function renderInventory() {
  destroyCharts();
  const kinds = {}; A.forEach((a) => kinds[a.type] = (kinds[a.type] || 0) + 1);
  let h = `<div class="sectionhead"><h2 style="font-size:28px">Data inventory</h2><p>Everything found in the file, including the parts that are not understood yet.</p></div>`;
  h += `<div class="grid g4">${tile("File", esc(D.file.name), "", `${(D.file.size / 1e6).toFixed(1)} MB`)}${tile("Sessions", D.file.sessions, "", `${kinds.flight || 0} flights · ${kinds.ground || 0} ground tests · ${kinds.power || 0} powered on · ${kinds.clock || 0} transmitter only`)}${tile("Sensor streams", D.fileInventory.length, "", `${D.fileInventory.filter((s) => s.level !== "known").length} not fully understood`)}${tile("GPS", "none", "", "Add a GPS sensor for distance and speed")}</div>`;
  h += inventoryTable(D.fileInventory, "f");
  h += `<div class="card"><h3>All sessions</h3><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Start</th><th>Kind</th><th class="r">Duration</th><th class="r">Max height</th><th class="r">Records</th></tr></thead><tbody>${A.map((a) => `<tr class="clickable" data-open="${a.s.index}"><td class="num">${a.s.index}</td><td class="num">${a.s.start ? a.s.start.slice(0, 16).replace("T", " ") : "–"}</td><td>${TYPE[a.type].label}</td><td class="r num">${dur(a.s.duration)}</td><td class="r num">${a.maxAlt != null ? f(a.maxAlt, 1) + " m" : "–"}</td><td class="r num">${a.s.records.toLocaleString("en")}</td></tr>`).join("")}</tbody></table></div></div>`;
  const m = document.getElementById("main"); m.innerHTML = h;
  m.querySelectorAll("tr[data-toggle]").forEach((tr) => tr.addEventListener("click", () => { const d = document.getElementById(tr.dataset.toggle); d.hidden = !d.hidden; }));
  m.querySelectorAll("[data-open]").forEach((r) => r.addEventListener("click", () => { state.filter = "all"; store.set("tlm.filter", "all"); state.tab = "overview"; select(+r.dataset.open); }));
}

/* ---------- navigation ---------- */
function select(i) { state.sel = i; if (state.filter === "flights" && A[i].type !== "flight") state.filter = "all"; go("session-" + i); }
function step(d) { const v = visibleSessions(), p = v.findIndex((a) => a.s.index === state.sel); const n = v[Math.max(0, Math.min(v.length - 1, (p < 0 ? 0 : p) + d))]; if (n) select(n.s.index); }
function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else route(); }
function route() {
  const h = location.hash.slice(1) || "session-" + state.sel;
  const m = /^session-(\d+)$/.exec(h);
  if (m && A[+m[1]]) { state.view = "sessions"; state.sel = +m[1]; }
  else if (h === "sessions") state.view = "sessions";
  else if (h === "batteries" || h === "inventory") state.view = h;
  document.querySelectorAll("[data-nav]").forEach((a) => a.setAttribute("aria-current", a.dataset.nav === state.view ? "page" : "false"));
  document.body.dataset.level = state.level;
  document.querySelectorAll("#levelSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.level === state.level));
  renderList();
  if (state.view === "batteries") renderBatteries();
  else if (state.view === "inventory") renderInventory();
  else renderSession();
}
document.querySelectorAll("#levelSeg button").forEach((b) => b.addEventListener("click", () => { state.level = b.dataset.level; store.set("tlm.level", state.level); route(); }));
document.querySelectorAll("#filterSeg button").forEach((b) => b.addEventListener("click", () => { state.filter = b.dataset.filter; store.set("tlm.filter", state.filter); renderList(); }));
document.addEventListener("keydown", (e) => {
  if (state.view !== "sessions" || e.target.closest("input,select,textarea")) return;
  if (e.key === "ArrowLeft" || e.key === "k") step(-1);
  if (e.key === "ArrowRight" || e.key === "j") step(1);
});
window.addEventListener("hashchange", route);
const drop = document.getElementById("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
document.getElementById("fileName").textContent = D.file.name;
document.getElementById("fileSize").textContent = (D.file.size / 1e6).toFixed(1) + " MB";
const mq = matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener?.("change", route);
new MutationObserver(route).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
route();
</script>
